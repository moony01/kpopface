{% assign kcl_embed_ads = include.ads | default: 'off' %}
{% if kcl_embed_ads != 'on' %}
    {% assign kcl_embed_ads = 'off' %}
{% endif %}

<section class="vote-wrapper kcl-embed-wrapper" data-kcl-embed>
    <iframe
        class="kcl-vote-embed"
        data-kcl-embed-frame
        data-kcl-embed-src="https://mearrow.com/embed/vote-board/{{ include.locale | default: 'en' }}?surface=kpopface&amp;ads={{ kcl_embed_ads }}"
        data-kcl-embed-local-src="http://localhost:3000/embed/vote-board/{{ include.locale | default: 'en' }}?surface=kpopface&amp;ads={{ kcl_embed_ads }}"
        title="KPOP Company League voting"
        loading="lazy"
        referrerpolicy="strict-origin-when-cross-origin"
        allow="clipboard-write"
    ></iframe>
    <noscript>
        <a href="https://kclhq.com/{{ include.locale | default: 'en' }}" target="_blank" rel="noopener">
            Vote in KPOP Company League
        </a>
    </noscript>
</section>
