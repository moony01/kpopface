<!DOCTYPE html>
<html lang="{{ page.lang | default: 'ko' }}">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#283618" />
    <meta name="kpopface-base-url" content="{{ site.baseurl | escape }}" />
    {% include seo-head.html %}

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css"
      integrity="sha384-9Z9AuAj0Xi0z7WFOSgjjow8EnNY9wPNp925TVLlAyWhvZPsf5Ks23Ex0mxIrWJzJ"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    {% if page.lang != "ko" %}
    <link rel="icon" href="../favicon.png" type="image/x-icon" />
    <link rel="stylesheet" href="../static/css/common.css" />
    <link rel="stylesheet" href="../static/css/loading.css" />
    <link rel="stylesheet" href="../static/css/main.css" />
    <link rel="stylesheet" href="../static/css/page-split.css?v=20260203d" />
    {% else %}
    <link rel="icon" href="favicon.png" type="image/x-icon" />
    <link rel="stylesheet" href="static/css/common.css" />
    <link rel="stylesheet" href="static/css/loading.css" />
    <link rel="stylesheet" href="static/css/main.css" />
    <link rel="stylesheet" href="static/css/page-split.css?v=20260203d" />
    {% endif %}

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Jua&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"
      integrity="sha384-SN6A48CJQjx946+DRb8wsoifC4a8ur9ZS6R+HCTgnBHOKCa6GLXAR3Qn8d1jztxg"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- 구글애드센스: 로컬 브라우저 검증에서는 외부 광고 요청을 생략한다. -->
    <script>
      (function () {
        var localHost = /^(localhost|127\.0\.0\.1|0\.0\.0\.0|\[::1\])$/.test(window.location.hostname);
        if (localHost) return;
        var adScript = document.createElement('script');
        adScript.async = true;
        adScript.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8955182453510440';
        adScript.crossOrigin = 'anonymous';
        document.head.appendChild(adScript);
      }());
    </script>
    <script
      class="jsbin"
      src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"
      integrity="sha384-1H217gwSVyLSIfaLxHbE7dRb3v4mYCKbpQvzx0cegeju1MVsGrX5xXxAvs/HgeFs"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>

    <!-- 페이지 분리용 스크립트 -->
    {% if page.lang != "ko" %}
    <script src="../static/js/result-security.js"></script>
    <script src="../static/js/page-router.js"></script>
    <script src="../static/js/visual-reports.js"></script>
    {% else %}
    <script src="static/js/result-security.js"></script>
    <script src="static/js/page-router.js"></script>
    <script src="static/js/visual-reports.js"></script>
    {% endif %}

    <title>
      {% if page.title %}{{ page.title | escape }}{% else %}{{ site.title | escape }}{% endif %}
    </title>
  </head>
  <body>
    <div class="page-split-container">
      {{ content }}
    </div>

    <footer class="footer">
      <span>© kpopface 2023. ALL Rights Reserved.</span>
      <a class="privacy" href="{{ site.url }}{{ site.baseurl }}/privacy.html">Privacy policy</a>
    </footer>
  </body>
</html>
